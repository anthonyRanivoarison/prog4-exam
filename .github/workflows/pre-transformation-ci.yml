name: POJA Import CI

on:
  push:
    branches:
      - import-fd6d02f2-4885-412b-bdb1-3ad56582e90e-pre-transformation
env:
  ORG_ID: 34ad79ad-625e-430b-95fd-4d141191d5d9
  IMPORT_ID: fd6d02f2-4885-412b-bdb1-3ad56582e90e

jobs:
  pre-transformation-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    

    steps:
      - uses: actions/checkout@v4.1.6

      - uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Run tests
        run: |
          if [ -f "build.gradle" ]; then
            chmod +x gradlew
            ./gradlew test
          elif [ -f "pom.xml" ]; then
            chmod +x mvnw
            ./mvnw test
          else
            echo "No build tool detected!" >&2
            exit 1
          fi

      - name: Zip test report
        if: always()
        run: |
          if [ -f "build.gradle" ]; then
            cd build/reports/tests/test && zip -r $GITHUB_WORKSPACE/PRE_TRANSFORMATION_TEST_REPORT.zip .
          elif [ -f "pom.xml" ]; then
            cd target/surefire-reports && zip -r $GITHUB_WORKSPACE/PRE_TRANSFORMATION_TEST_REPORT.zip .
          fi

      - name: Upload test report
        if: always()
        run: |
          curl --fail -X POST "https://api.prod.poja.io/orgs/${{ env.ORG_ID }}/imports/${{ env.IMPORT_ID }}/test-reports/PRE_TRANSFORMATION_TEST_REPORT" \
            -H "Authorization: AppImportBearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @PRE_TRANSFORMATION_TEST_REPORT.zip

  update-import-state:
    runs-on: ubuntu-latest
    needs: pre-transformation-test
    if: always()

    steps:
      - name: Update import state
        run: |
          REPO_NAME=$(basename "${GITHUB_REPOSITORY}")

          if [ "${{ needs.pre-transformation-test.result }}" == "success" ]; then
            JOB_STATUS="SUCCESS"
          else
            JOB_STATUS="FAILURE"
          fi

          curl --fail -X POST "https://api.prod.poja.io/orgs/${{ env.ORG_ID }}/imports/${{ env.IMPORT_ID }}/states" \
            -H "Authorization: AppImportBearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
                  --arg job_name "PRE_TRANSFORMATION_TEST" \
                  --arg job_status "$JOB_STATUS" \
                  --arg run_id "${{ github.run_id }}" \
                  --arg attempt_nb "${{ github.run_attempt }}" \
                  --arg repo_owner "${{ github.repository_owner }}" \
                  --arg repo_name "$REPO_NAME" \
                  '{ job_name: $job_name, job_status: $job_status, run_id: $run_id, attempt_nb: $attempt_nb, repo_owner: $repo_owner, repo_name: $repo_name }')"